name: Notify Profile README

on:
  push:
    paths:
      - "**.md"
  workflow_dispatch:  # allow manual trigger for testing

jobs:
  build-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required for git push
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for git log
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate index.json
        run: node scripts/generate-index.js

      - name: Commit index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          git diff --staged --quiet || git commit -m "📝 update index.json"
          git push

      - name: Notify profile repo
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/allwayso/Allwayso/dispatches \
            -d '{"event_type": "til-updated"}' > /dev/null
